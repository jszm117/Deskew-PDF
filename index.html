<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meow-DF Deskewer 🐾</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #eff6ff; }
        ::-webkit-scrollbar-thumb { background: #93c5fd; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #3b82f6; }
        input[type=range] { accent-color: #2563eb; }
    </style>

    <!-- 1. Define the WASM Module BEFORE loading OpenCV -->
    <script>
        var Module = {
            onRuntimeInitialized: function() {
                // This automatically fires the exact millisecond OpenCV is fully compiled and ready
                if (typeof initApp === 'function') {
                    initApp();
                }
            },
            printErr: function(text) {
                console.error("OpenCV WASM Error: ", text);
                setTimeout(() => {
                    document.getElementById('status-msg').innerHTML = `<span class="text-red-600">Cat-astrophe! OpenCV failed to initialize.</span>`;
                }, 1000);
            }
        };

        function onScriptLoadError() {
            document.getElementById('status-msg').innerHTML = `
                <span class="text-red-600">Error: Could not find opencv.js!</span><br>
                <span class="text-sm text-blue-600">Make sure the file is named exactly <b>opencv.js</b> (all lowercase) and is in the root of your GitHub repository.</span>
            `;
            document.getElementById('cv-status').innerHTML = 'File missing!';
            document.getElementById('cv-status').classList.replace('text-blue-600', 'text-red-600');
        }
    </script>

    <!-- 2. Load the local OpenCV file -->
    <script src="opencv.js" onerror="onScriptLoadError()" async></script>

</head>
<body class="bg-blue-50 text-blue-900 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white shadow-sm py-5 px-8 border-b-4 border-blue-200">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="text-4xl">😻</div>
                <div>
                    <h1 class="text-2xl font-bold text-blue-800">Meow-DF Deskewer</h1>
                    <p class="text-sm text-blue-500 font-medium">100% Client-side Auto-Straightening for Scanned PDFs</p>
                </div>
            </div>
            <div id="cv-status" class="flex items-center text-sm font-bold text-blue-600 bg-blue-100 px-4 py-2 rounded-full shadow-sm">
                <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                Waking up the cats...
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-6xl mx-auto w-full p-8 flex flex-col gap-6">
        
        <div id="dropzone" class="w-full border-4 border-dashed border-blue-200 rounded-3xl bg-white p-12 flex flex-col items-center justify-center text-center transition-all opacity-50 pointer-events-none hover:border-blue-500 hover:bg-blue-100 cursor-pointer shadow-sm">
            <div class="text-6xl mb-4">📥🐈</div>
            <h3 id="status-msg" class="text-xl font-bold text-blue-800">Please wait for the cats to wake up...</h3>
            <p class="text-blue-500 mt-2 font-medium" id="sub-status-msg">Drop a multi-page scanned PDF here to let them fix it</p>
            <input type="file" id="file-input" class="hidden" accept="application/pdf" />
        </div>

        <div id="progress-container" class="hidden bg-white p-6 rounded-3xl shadow-md border-2 border-blue-100">
            <div class="flex justify-between items-end mb-2">
                <span id="progress-text" class="text-sm font-bold text-blue-600">🐾 Paw-cessing page 1 of X...</span>
                <span id="progress-percent" class="text-xs font-bold text-blue-400">0%</span>
            </div>
            <div class="w-full bg-blue-100 rounded-full h-4 overflow-hidden">
                <div id="progress-bar" class="bg-blue-500 h-4 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>

        <div id="action-bar" class="hidden flex justify-between items-center bg-white p-5 rounded-3xl shadow-md border-2 border-blue-100">
            <span class="text-blue-700 font-bold ml-2">😸 Look good? Adjust angles below if the cats missed a spot.</span>
            <button id="download-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition-transform transform hover:scale-105 flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                Download Paw-fect PDF
            </button>
        </div>

        <div id="results-container" class="grid grid-cols-1 md:grid-cols-2 gap-6 pb-12"></div>

    </main>

    <script>
        const pdfjsLib = window['pdfjs-dist/build/pdf'];
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        let processedPages = [];
        let originalFileName = "document.pdf";
        const HIGH_RES_SCALE = 3.0; 

        // Saftey fallback in case onRuntimeInitialized fired before the DOM was ready
        window.addEventListener('load', () => {
            if (typeof cv !== 'undefined' && cv.Mat && document.getElementById('dropzone').classList.contains('pointer-events-none')) {
                initApp();
            }
        });

        function initApp() {
            const cvStatus = document.getElementById('cv-status');
            cvStatus.classList.remove('bg-blue-100', 'text-blue-600');
            cvStatus.classList.add('bg-blue-600', 'text-white');
            cvStatus.innerHTML = `🐈 Cats are ready!`;

            const dropzone = document.getElementById('dropzone');
            dropzone.classList.remove('opacity-50', 'pointer-events-none');
            document.getElementById('status-msg').innerText = "Drag & Drop a scanned PDF or Click to Browse";
            document.getElementById('sub-status-msg').style.display = 'block';

            dropzone.addEventListener('click', () => document.getElementById('file-input').click());
            dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('bg-blue-100', 'border-blue-500'); });
            dropzone.addEventListener('dragleave', () => { dropzone.classList.remove('bg-blue-100', 'border-blue-500'); });
            dropzone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropzone.classList.remove('bg-blue-100', 'border-blue-500');
                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    handleFile(e.dataTransfer.files[0]);
                }
            });
            document.getElementById('file-input').addEventListener('change', (e) => {
                if (e.target.files && e.target.files.length > 0) {
                    handleFile(e.target.files[0]);
                }
            });
            document.getElementById('download-btn').addEventListener('click', generateFinalPDF);
        }

        async function handleFile(file) {
            if (file.type !== "application/pdf") {
                alert("Only PDFs allowed! 😾");
                return;
            }
            
            originalFileName = file.name;
            processedPages = [];
            document.getElementById('dropzone').classList.add('hidden');
            document.getElementById('results-container').innerHTML = '';
            document.getElementById('action-bar').classList.add('hidden');
            document.getElementById('progress-container').classList.remove('hidden');

            const arrayBuffer = await file.arrayBuffer();
            const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
            
            try {
                const pdf = await loadingTask.promise;
                const totalPages = pdf.numPages;

                for (let i = 1; i <= totalPages; i++) {
                    updateProgress(i, totalPages);
                    
                    const page = await pdf.getPage(i);
                    const viewport = page.getViewport({ scale: HIGH_RES_SCALE });
                    
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    
                    await page.render({ canvasContext: ctx, viewport: viewport }).promise;

                    const detectedAngle = detectSkewAngle(canvas);
                    const processedCanvas = rotateCanvas(canvas, -detectedAngle);

                    processedPages.push({
                        pageNum: i,
                        originalCanvas: canvas,
                        processedCanvas: processedCanvas,
                        angle: detectedAngle
                    });

                    renderPageUI(i - 1); 
                    await new Promise(resolve => setTimeout(resolve, 50)); 
                }
                
                document.getElementById('progress-container').classList.add('hidden');
                document.getElementById('action-bar').classList.remove('hidden');
                
            } catch (err) {
                console.error(err);
                alert("Error parsing PDF. See console for details.");
            }
        }

        function updateProgress(current, total) {
            const percent = Math.round((current / total) * 100);
            document.getElementById('progress-text').innerText = `🐾 Paw-cessing page ${current} of ${total}...`;
            document.getElementById('progress-percent').innerText = `${percent}%`;
            document.getElementById('progress-bar').style.width = `${percent}%`;
        }

                function detectSkewAngle(canvas) {
            try {
                let src = cv.imread(canvas);
                
                // 1. Scale down to make processing faster and help text merge together
                let resized = new cv.Mat();
                let scale = 800 / src.cols;
                cv.resize(src, resized, new cv.Size(800, Math.round(src.rows * scale)));

                // 2. Convert to grayscale
                let gray = new cv.Mat();
                cv.cvtColor(resized, gray, cv.COLOR_RGBA2GRAY, 0);

                // 3. Invert colors (text becomes white, background becomes black)
                cv.bitwise_not(gray, gray);

                // 4. Thresholding to make the image strictly black and white
                let thresh = new cv.Mat();
                cv.threshold(gray, thresh, 0, 255, cv.THRESH_BINARY | cv.THRESH_OTSU);

                // 5. Morphological Dilation: Smudge text horizontally to create solid lines
                // We use a kernel that is wide (30) and short (5)
                let kernel = cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(30, 5));
                let dilated = new cv.Mat();
                cv.dilate(thresh, dilated, kernel, new cv.Point(-1, -1), 1, cv.BORDER_CONSTANT, cv.morphologyDefaultBorderValue());

                // 6. Detect lines on the newly created solid text blocks
                let lines = new cv.Mat();
                cv.HoughLinesP(dilated, lines, 1, Math.PI / 180, 100, 100, 20);

                let angles = [];
                for (let i = 0; i < lines.rows; ++i) {
                    let x1 = lines.data32S[i * 4];
                    let y1 = lines.data32S[i * 4 + 1];
                    let x2 = lines.data32S[i * 4 + 2];
                    let y2 = lines.data32S[i * 4 + 3];
                    
                    let angle = Math.atan2(y2 - y1, x2 - x1) * (180 / Math.PI);
                    
                    // Normalize the angle to check for horizontal skew
                    if (angle < -45) angle += 90;
                    if (angle > 45) angle -= 90;
                    
                    // Only collect realistic minor skews (-15 to +15)
                    if (angle >= -15 && angle <= 15) {
                        angles.push(angle);
                    }
                }
                
                // Cleanup memory to prevent memory leaks in WebAssembly
                src.delete(); resized.delete(); gray.delete(); thresh.delete(); 
                kernel.delete(); dilated.delete(); lines.delete();

                if (angles.length === 0) return 0;
                
                // 7. Find the Median angle for accuracy
                angles.sort((a, b) => a - b);
                let medianAngle = angles[Math.floor(angles.length / 2)];
                
                // Ignore microscopic sub-degree angles (less than 0.2°) to prevent blurring 
                // essentially straight pages during canvas re-rendering
                if (Math.abs(medianAngle) < 0.2) return 0;

                return medianAngle;
                
            } catch (err) {
                console.error("OpenCV detection failed on page:", err);
                return 0; // Fallback to 0 if the page has no readable structure
            }
        }


        function rotateCanvas(sourceCanvas, angle) {
            let canvas = document.createElement('canvas');
            let ctx = canvas.getContext('2d');
            
            canvas.width = sourceCanvas.width;
            canvas.height = sourceCanvas.height;
            ctx.fillStyle = "white";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.rotate(angle * Math.PI / 180);
            ctx.drawImage(sourceCanvas, -sourceCanvas.width / 2, -sourceCanvas.height / 2);
            
            return canvas;
        }

        function renderPageUI(index) {
            const page = processedPages[index];
            const container = document.getElementById('results-container');
            
            const origPreview = page.originalCanvas.toDataURL('image/jpeg', 0.4);
            const procPreview = page.processedCanvas.toDataURL('image/jpeg', 0.4);

            const card = document.createElement('div');
            card.className = "bg-white p-5 rounded-3xl shadow-sm border-2 border-blue-100 flex flex-col gap-4";
            card.innerHTML = `
                <div class="flex justify-between items-center border-b-2 border-blue-50 pb-2">
                    <h4 class="font-bold text-blue-900">📄 Page ${page.pageNum}</h4>
                    <span class="text-xs font-bold px-3 py-1 rounded-full bg-blue-100 text-blue-600" id="badge-${index}">Auto-detected 🐾</span>
                </div>
                
                <div class="flex gap-4 items-center justify-center bg-blue-50/50 p-4 rounded-2xl">
                    <div class="flex flex-col items-center w-1/2">
                        <span class="text-xs text-blue-400 mb-2 uppercase tracking-wider font-bold">Crooked 😿</span>
                        <img src="${origPreview}" class="max-h-64 border-2 border-blue-100 shadow-sm rounded" />
                    </div>
                    <div class="text-2xl text-blue-300">➡️</div>
                    <div class="flex flex-col items-center w-1/2">
                        <span class="text-xs text-blue-600 mb-2 uppercase tracking-wider font-bold">Purr-fect 😸</span>
                        <img src="${procPreview}" id="img-proc-${index}" class="max-h-64 border-2 border-blue-400 shadow-md rounded" />
                    </div>
                </div>

                <div class="mt-2 bg-blue-50 p-4 rounded-2xl">
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-sm font-bold text-blue-800">Manual Nudge</label>
                        <span id="angle-val-${index}" class="text-sm font-bold bg-white px-2 py-1 rounded shadow-sm text-blue-700">${(-page.angle).toFixed(1)}°</span>
                    </div>
                    <input type="range" min="-15" max="15" step="0.1" value="${-page.angle}" 
                           class="w-full h-2 bg-blue-200 rounded-lg appearance-none cursor-pointer"
                           oninput="updateAngleUI(${index}, this.value)"
                           onchange="applyManualRotation(${index}, this.value)">
                    <div class="flex justify-between text-xs font-bold text-blue-400 mt-2">
                        <span>-15°</span><span>0°</span><span>+15°</span>
                    </div>
                </div>
            `;
            container.appendChild(card);
        }

        function updateAngleUI(index, sliderValue) {
            document.getElementById(`angle-val-${index}`).innerText = `${parseFloat(sliderValue).toFixed(1)}°`;
        }

        function applyManualRotation(index, sliderValue) {
            const page = processedPages[index];
            const newAngle = -parseFloat(sliderValue); 
            
            page.angle = newAngle;
            page.processedCanvas = rotateCanvas(page.originalCanvas, newAngle);
            
            document.getElementById(`img-proc-${index}`).src = page.processedCanvas.toDataURL('image/jpeg', 0.4);
            
            const badge = document.getElementById(`badge-${index}`);
            badge.innerText = "Human Adjusted 🐈‍⬛";
            badge.classList.replace('bg-blue-100', 'bg-purple-100');
            badge.classList.replace('text-blue-600', 'text-purple-600');
        }

        async function generateFinalPDF() {
            const btn = document.getElementById('download-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<svg class="animate-spin -ml-1 mr-2 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Packaging PDF...`;
            btn.disabled = true;

            try {
                const pdfDoc = await PDFLib.PDFDocument.create();

                for (const page of processedPages) {
                    const imgDataUrl = page.processedCanvas.toDataURL('image/jpeg', 0.95);
                    const jpgImage = await pdfDoc.embedJpg(imgDataUrl);
                    
                    const width = page.processedCanvas.width;
                    const height = page.processedCanvas.height;
                    
                    const pdfPage = pdfDoc.addPage([width, height]);
                    pdfPage.drawImage(jpgImage, {
                        x: 0,
                        y: 0,
                        width: width,
                        height: height,
                    });
                }

                const pdfBytes = await pdfDoc.save();
                
                const blob = new Blob([pdfBytes], { type: "application/pdf" });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = originalFileName.replace('.pdf', '_pawfect.pdf');
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
            } catch (error) {
                console.error(error);
                alert("The cats dropped the PDF! Check console for errors.");
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
